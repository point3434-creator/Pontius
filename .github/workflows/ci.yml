name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Behavioral tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the isolated CPU environment
        run: uv sync --locked --group dev --python ${{ matrix.python }}
      - name: Run behavioral tests
        run: uv run --no-sync pytest -p no:cacheprovider
