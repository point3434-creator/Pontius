[project]
name = "pontius"
version = "0.1.0"
description = "Exact-game laboratory for an adaptive neural multiplayer poker agent"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
sparse-screen = ["numpy==2.5.2", "scipy==1.18.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
